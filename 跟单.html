          <p><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;">跟单项目的可用余额不足</span><span style="font-family:'ArialMT', 'Arial', sans-serif;">;</span></p><p><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;">当带单用户使用限价，或限价止盈止损单买入，委托没有完全成交时，不进行跟单</span><span style="font-family:'ArialMT', 'Arial', sans-serif;">;</span></p><p><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;">当市场滑点超过滑点最大参数限制</span><span style="font-family:'ArialMT', 'Arial', sans-serif;">;</span></p><p><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;">买入金额小于最小买入金额。注意</span><span style="font-family:'ArialMT', 'Arial', sans-serif;">: </span><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;">当跟单项目的余额低于项目最小跟单金额，并出现连续五次跟单失败，该项目将被自动关闭。跟单失败的原因包括</span><span style="font-family:'ArialMT', 'Arial', sans-serif;">: </span><span style="font-family:'PingFangSC-Regular', 'PingFang SC', sans-serif;">跟单余额不足，买入金额小于最小买入金额等。系统将于每周五检查并关闭此类跟单项目。</span></p>
